[project]
name = "competencia-asa"
version = "0.1.0"
description = "EDA y visualización para la Competencia ASA"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "wbgapi>=1.0.14",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
